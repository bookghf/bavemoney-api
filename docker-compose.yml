name: money

services:
  db:
    image: postgres:16-alpine
    container_name: ledger-db
    # Every credential comes from money-api/.env (git-ignored); see .env.example.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in money-api/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in money-api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in money-api/.env}
    ports:
      # Loopback only: reachable from this machine's tools, not the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      # Inside the network the database host is "db", not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in money-api/.env (see .env.example)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
